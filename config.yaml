prompting:
  - type: "zero-shot"
    name: "zero-shot-no-reasoning"
    reasoning_enabled: false
  # - type: "zero-shot"
  #   name: "zero-shot-reasoning"
  #   reasoning_enabled: true
  - type: "few-shot"
    name: "few-shot-smart-no-reasoning"
    reasoning_enabled: false
    num_shots: 10
    few_shot_mode: "smart"
    embedding_model_path: "BAAI/bge-small-en-v1.5"
  # - type: "few-shot"
  #   name: "few-shot-smart-reasoning"
  #   reasoning_enabled: true
  #   num_shots: 6
  #   few_shot_mode: "smart"
  #   embedding_model_path: "BAAI/bge-small-en-v1.5"
  - type: "few-shot"
    name: "few-shot-random-no-reasoning"
    reasoning_enabled: false
    num_shots: 10
    few_shot_mode: "random"
  # - type: "few-shot"
  #   name: "few-shot-random-reasoning"
  #   reasoning_enabled: true
  #   num_shots: 6
