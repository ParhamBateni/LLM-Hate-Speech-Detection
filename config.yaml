hate_speech_criteria_domain: "data/definitions/domain.json"

datasets:
  hatecheck:
    path: "data/HateCheck/extended_hatecheck(in).csv"
    text_column: "test_case"
    label_column: "label_gold"
    hate_speech_definitions:
      - type: "vanilla"
        name: "hatecheck_vanilla"
        path: "data/definitions/hatecheck.json"
      # - type: "criteria"
      #   name: "hatecheck_hsc"
      #   path: "data/definitions/hatecheck.json"
      #   include_definition_text: false
      # - type: "criteria"
      #   name: "hatecheck_hsc_mixed"
      #   path: "data/definitions/hatecheck.json"
      #   include_definition_text: true
    enable: true
models:
  llama3_2_1b_instruct:
    path: "meta-llama/Llama-3.2-1B-Instruct"
    enable: true
  llama3_1_8b_instruct:
    path: "meta-llama/Meta-Llama-3.1-8B-Instruct"
    enable: false
  mistral_7b_instruct:
    path: "mistralai/Mistral-7B-Instruct"
    enable: false
  flan_t5_small:
    path: "google/flan-t5-small"
    enable: false
prompting:
  - type: "zero-shot"
  # - type: "few-shot"
  #   num_shots: 5
  #   few_shot_mode: "random"
  # - type: "few-shot"
  #   num_shots: 5
  #   few_shot_mode: "smart"
  # - type: "chain-of-thought"

extra_hate_speech_definitions: {}
debug_mode: true
save_predictions: true
num_generation_retries: 5
generation:
  seed: 42
  do_sample: true
  max_new_tokens: 100
  temperature: 0.7
  top_p: 0.9