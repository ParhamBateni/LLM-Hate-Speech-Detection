extra_hate_speech_definitions:
  - type: "vanilla"
    name: "no_definition"
    definition_text: ""
    null_baseline: true
    apply_to_datasets:
      - hatecheck
      - hatexplain

debug_mode: false
save_predictions: true
num_generation_retries: 4
generation:
  seed: 42
  do_sample: false
  max_new_tokens: 200
  temperature: 0.0
  top_p: 1.0
