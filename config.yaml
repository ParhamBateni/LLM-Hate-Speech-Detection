hate_speech_criteria_domain: "data/definitions/domain.json"

datasets:
  hatecheck:
    path: "data/datasets/HateCheck/processed_hatecheck.csv"
    text_column: "test_case"
    label_column: "label_gold"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "vanilla"
      name: "no_definition"
      definition_text: ""
    - type: "vanilla"
      name: "hatecheck_vanilla"
      path: "data/definitions/hatecheck.json"
    - type: "criteria"
      name: "hatecheck_hsc"
      path: "data/definitions/hatecheck.json"
  
  hatecheck_bulgaria:
    path: "data/datasets/HateCheck/hatecheck_relabeled_bulgaria.csv"
    text_column: "test_case"
    label_column: "def_label"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "criteria"
      name: "bulgaria_hsc"
      path: "data/definitions/bulgaria.json"

    - type: "criteria"
      name: "bulgaria_hsc_target_excluded"
      path: "data/definitions/bulgaria.json"
      exclude_aspects: ["target_groups"]

  hatecheck_croatia:
    path: "data/datasets/HateCheck/hatecheck_relabeled_croatia.csv"
    text_column: "test_case"
    label_column: "def_label"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "criteria"
      name: "croatia_hsc"
      path: "data/definitions/croatia.json"
  
  hatecheck_meta:
    path: "data/datasets/HateCheck/hatecheck_relabeled_meta.csv"
    text_column: "test_case"
    label_column: "def_label"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "criteria"
      name: "meta_hsc"
      path: "data/definitions/meta.json"
  
  hatecheck_reddit:
    path: "data/datasets/HateCheck/hatecheck_relabeled_reddit.csv"
    text_column: "test_case"
    label_column: "def_label"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "criteria"
      name: "reddit_hsc"
      path: "data/definitions/reddit.json"
  
  hatecheck_theoretical:
    path: "data/datasets/HateCheck/hatecheck_relabeled_theoretical.csv"
    text_column: "test_case"
    label_column: "def_label"
    id_column: "case_id"
    hate_speech_definitions:
    - type: "criteria"
      name: "theoretical_hsc"
      path: "data/definitions/theoretical.json"
    - type: "criteria"
      name: "theoretical_hsc_target_excluded"
      path: "data/definitions/theoretical.json"
      exclude_aspects: ["target_groups"]

models:
  # gemma2_2b_it:
  #   path: "google/gemma-2-2b-it"
  llama3_2_1b_instruct:
    path: "meta-llama/Llama-3.2-1B-Instruct"
  # llama3_2_3b_instruct:
  #   path: "meta-llama/Llama-3.2-3B-Instruct"
  # qwen2_5_3b_instruct:
  #   path: "Qwen/Qwen2.5-3B-Instruct"

prompting:
  - type: "zero-shot"
    name: "zero-shot"
    reasoning_enabled: false
  - type: "few-shot"
    name: "few-shot-random"
    reasoning_enabled: false
    num_shots_per_group: 4
    few_shot_mode: "random"
  - type: "few-shot"
    name: "few-shot-diverse"
    reasoning_enabled: false
    num_shots_per_group: 4
    few_shot_mode: "diverse"
    embedding_model_path: "nomic-ai/nomic-embed-text-v1.5"
  - type: "few-shot"
    name: "few-shot-nearest-query"
    reasoning_enabled: false
    num_shots_per_group: 4
    few_shot_mode: "nearest_query"
    embedding_model_path: "nomic-ai/nomic-embed-text-v1.5"

extra_hate_speech_definitions: []

debug_mode: true
save_predictions: true
compute_confidence_score: true
num_generation_retries: 4
generation:
  seed: 42
  do_sample: false
  max_new_tokens: 100
  temperature: 0.0
  top_p: 1.0
