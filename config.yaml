models:
  # gemma2_2b_it:
  #   path: "google/gemma-2-2b-it"
  # phi3_mini:
  #   path: "microsoft/Phi-3.5-mini-instruct"
  # llama3_2_1b_instruct:
  #   path: "meta-llama/Llama-3.2-1B-Instruct"
  llama3_2_3b_instruct:
    path: "meta-llama/Llama-3.2-3B-Instruct"
  qwen2_5_3b_instruct:
    path: "Qwen/Qwen2.5-3B-Instruct"

prompting:
  - type: "zero-shot"
    name: "zero-shot"
    reasoning_enabled: false
  # - type: "zero-shot"
  #   name: "zero-shot-reasoning"
  #   reasoning_enabled: true
  - type: "few-shot"
    name: "few-shot-smart"
    reasoning_enabled: false
    num_shots_per_group: 4
    few_shot_mode: "smart"
    embedding_model_path: "BAAI/bge-small-en-v1.5"
  # - type: "few-shot"
  #   name: "few-shot-smart-reasoning"
  #   reasoning_enabled: true
  #   num_shots: 6
  #   few_shot_mode: "smart"
  #   embedding_model_path: "BAAI/bge-small-en-v1.5"
  - type: "few-shot"
    name: "few-shot-random"
    reasoning_enabled: false
    num_shots_per_group: 4
    few_shot_mode: "random"
  # - type: "few-shot"
  #   name: "few-shot-random-reasoning"
  #   reasoning_enabled: true
  #   num_shots: 6
  #   few_shot_mode: "random"

extra_hate_speech_definitions:
  - type: "vanilla"
    name: "no_definition"
    definition_text: ""

debug_mode: false
save_predictions: true
compute_confidence_score: true
num_generation_retries: 4
generation:
  seed: 42
  do_sample: false
  max_new_tokens: 100
  temperature: 0.0
  top_p: 1.0
